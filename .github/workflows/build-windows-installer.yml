name: build-windows-installer

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install numpy">=2.0,<3" opencv-python==4.14.0.94 pillow==12.3.0 tqdm "psutil==7.2.2" cv2_enumerate_cameras==1.3.3 typing-extensions
          pip install onnx==1.22.0 "onnxruntime-gpu==1.26.0" insightface==0.7.3 opennsfw2==0.18.0 "keras>=3.0.0" "protobuf>=6.33.5,<8"
          pip install "PySide6>=6.7,<7" pygrabber pyvirtualcam pyinstaller

      - name: Build onedir app
        env:
          PYTHONPATH: ""
        run: |
          pyinstaller --noconfirm --clean --onedir \
            --name deep-live-cam \
            --paths . \
            --add-data "locales;locales" \
            --hidden-import pyvirtualcam \
            --hidden-import pyvirtualcam_native_windows_dshow \
            --hidden-import insightface \
            --hidden-import opennsfw2 \
            --hidden-import keras \
            --hidden-import cv2_enumerate_cameras \
            --hidden-import psutil \
            --exclude-module tkinter \
            --exclude-module torch \
            --exclude-module tensorflow \
            --exclude-module jax \
            --exclude-module customtkinter \
            run.py

      - name: Bundle models and ffmpeg
        run: |
          cd dist/deep-live-cam
          # inswapper at install root next to the exe (MODELS_DIR = <exe>/models)
          mkdir -p models/buffalo_l
          curl -sL --fail --retry 3 -o models/inswapper_128.onnx \
            "https://huggingface.co/hacksider/deep-live-cam/resolve/main/inswapper_128.onnx"
          ls -la models/
          # buffalo_l pack for insightface (prefilled on first run)
          for f in 1k3d68.onnx 2d106det.onnx det_10g.onnx genderage.onnx w600k_r50.onnx; do
            curl -sL --fail --retry 3 -o "models/buffalo_l/$f" \
              "https://huggingface.co/hacksider/deep-live-cam/resolve/main/buffalo_l/buffalo_l/$f"
          done
          ls -la models/buffalo_l/
          # ffmpeg (required for video export / frame extraction)
          curl -sL --fail --retry 3 -o ffmpeg.zip "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
          unzip -o -j ffmpeg.zip "*/bin/ffmpeg.exe" "*/bin/ffprobe.exe" -d ffmpeg/
          rm ffmpeg.zip
          ls -la ffmpeg/

      - name: Generate app icon
        run: |
          python -c "from PIL import Image; img=Image.open('media/Download.png').convert('RGBA'); img.save('media/dlc.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
          ls -la media/dlc.ico

      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress

      - name: Download VC++ redistributable
        run: |
          cd dist/deep-live-cam
          curl -sL --retry 3 -o vc_redist.x64.exe \
            "https://aka.ms/vs/17/release/vc_redist.x64.exe"
          ls -la vc_redist.x64.exe

      - name: Assemble installer script
        run: |
          HASH=$(python -c "import hashlib;print(hashlib.sha256(open('dist/deep-live-cam/models/inswapper_128.onnx','rb').read()).hexdigest())")
          cat > installer.iss <<EOF
          ; Deep-Live-Cam Windows installer (Inno Setup 6)
          ; Generated by CI - do not edit by hand
          #define MyAppName "Deep-Live-Cam"
          #define MyAppVersion "2.7.5"
          #define MyAppExeName "deep-live-cam.exe"

          [Setup]
          AppId={{C93FB075-C1C1-47DB-A96E-F108C35141FE}
          AppName={#MyAppName}
          AppVersion={#MyAppVersion}
          AppVerName={#MyAppName} {#MyAppVersion} (Ultimate Open Edition)
          DefaultDirName={autopf}\\Deep-Live-Cam
          DefaultGroupName={#MyAppName}
          DisableProgramGroupPage=yes
          OutputDir=installer
          OutputBaseFilename=Deep-Live-Cam-2.7.5-Ultimate-Setup
          Compression=lzma2/max
          SolidCompression=yes
          WizardStyle=modern
          PrivilegesRequired=admin
          ArchitecturesInstallIn64BitMode=x64compatible
          UninstallDisplayIcon={app}\\deep-live-cam.exe
          SetupIconFile=media\\dlc.ico
          SignTool=None

          [Languages]
          Name: "english"; MessagesFile: "compiler:Default.isl"

          [Files]
          Source: "dist\\deep-live-cam\\*"; DestDir: "{app}"; Flags: recursesubdirs ignoreversion
          Source: "dist\\deep-live-cam\\vc_redist.x64.exe"; DestDir: "{app}"; Flags: ignoreversion deleteafterinstall

          [Icons]
          Name: "{group}\\{#MyAppName}"; Filename: "{app}\\{#MyAppExeName}"
          Name: "{autodesktop}\\{#MyAppName}"; Filename: "{app}\\{#MyAppExeName}"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"; Flags: unchecked

          [Run]
          Filename: "{app}\\vc_redist.x64.exe"; Parameters: "/install /quiet /norestart"; StatusMsg: "Installing VC++ runtime..."; Flags: waituntilterminated
          Filename: "{app}\\{#MyAppExeName}"; Description: "{cm:LaunchProgram,{#MyAppName}}"; Flags: nowait postinstall skipifsilent

          [UninstallDelete]
          Type: filesandordirs; Name: "{app}"
          EOF
          echo "inswapper sha256: $HASH"

      - name: Build installer
        run: |
          "C:/Program Files (x86)/Inno Setup 6/ISCC.exe" installer.iss

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: deep-live-cam-windows-installer
          path: installer/Deep-Live-Cam-2.7.5-Ultimate-Setup.exe
          compression-level: 0
          if-no-files-found: error
